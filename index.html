<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clavier Classroom — j’apprends à taper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="confetti" class="confetti" aria-hidden="true"></div>

  <header class="topbar">
    <h1 class="logo"><span class="logo-key">⌨</span> Clavier Classroom</h1>
    <div class="controls">
      <label class="select">
        Niveau
        <select id="level-select" aria-label="Choisir le niveau"></select>
      </label>
      <button id="sound-btn" class="icon-btn" type="button" aria-label="Couper le son">🔊</button>
      <button id="reset-btn" class="icon-btn" type="button" aria-label="Tout recommencer">↺</button>
    </div>
  </header>

  <main class="stage">
    <section class="panel">
      <div class="level-head">
        <h2 id="level-name">Niveau</h2>
        <div class="bar bar--level"><i id="level-bar"></i></div>
      </div>
      <p id="level-hint" class="hint"></p>

      <div class="sequence-wrap">
        <div id="sequence" class="sequence" aria-live="polite"></div>
        <div class="bar bar--seq"><i id="seq-bar"></i></div>
      </div>

      <p id="finger-hint" class="finger-hint"></p>
      <p id="layout-warning" class="warning" hidden>
        Beaucoup d’erreurs d’affilée : vérifie que ton clavier est bien en <strong>AZERTY français</strong>.
      </p>

      <div id="keyboard" class="keyboard" aria-hidden="true"></div>

      <ul id="legend" class="legend" aria-label="Couleur de chaque doigt"></ul>
    </section>

    <aside class="side">
      <div class="mascot-box">
        <div id="bubble" class="bubble"></div>
        <svg id="mascot" class="mascot" data-mood="idle" viewBox="0 0 120 120" role="img" aria-label="Mascotte">
          <circle class="m-face" cx="60" cy="62" r="44"></circle>
          <circle class="m-cheek" cx="36" cy="74" r="8"></circle>
          <circle class="m-cheek" cx="84" cy="74" r="8"></circle>
          <circle class="m-eye" cx="46" cy="52" r="6"></circle>
          <circle class="m-eye" cx="74" cy="52" r="6"></circle>
          <path class="m-mouth m-idle" d="M46 78 Q60 86 74 78"></path>
          <path class="m-mouth m-happy" d="M42 74 Q60 96 78 74"></path>
          <path class="m-mouth m-oops" d="M46 84 Q60 72 74 84"></path>
          <path class="m-tuft" d="M60 18 q10 -8 14 4 q-8 -2 -14 6z"></path>
        </svg>
      </div>

      <dl class="scores">
        <div><dt>Étoiles</dt><dd id="stars">0</dd></div>
        <div><dt>Série</dt><dd id="streak">0</dd></div>
        <div><dt>Mots/min</dt><dd id="wpm">0</dd></div>
        <div><dt>Précision</dt><dd id="accuracy">100%</dd></div>
      </dl>
    </aside>
  </main>

  <script type="module" src="js/main.js"></script>
  <script data-goatcounter="https://clavier.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
